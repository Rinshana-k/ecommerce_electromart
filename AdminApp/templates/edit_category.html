<!DOCTYPE html>
{% extends 'dashboard.html' %}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="col-12 grid-margin stretch-card">

                <div class="card">
                  <div class="card-body">
                    <h4 class="card-title">Edit Catyegory here...</h4>

                    <form class="forms-sample" method="post" action="{% url 'update_category' c_id=category.id %}" enctype="multipart/form-data">
                        {% csrf_token %}
                      <div class="form-group">
                        <label for="exampleInputName1">Category Name</label>
                        <input type="text" class="form-control" id="exampleInputName1" placeholder="category name" name="c_name" value="{{category.Category_name}}">
                      </div>

                     <div class="form-group">
                        <label for="exampleTextarea1">Description</label>
                        <textarea class="form-control" id="exampleTextarea1" rows="4" name="despn">{{category.Description}}</textarea>
                      </div>

                      <div class="form-group">
                        <label>Upload Category image</label>
                        <div class="input-group col-xs-12">
                            <img src="{{category.Category_img.url}}" height="100px" width="100px">
                          <input type="file" class="form-control "  placeholder="Upload Image" name="c_img">
                        </div>
                      </div>


                      <button type="submit" class="btn btn-primary mr-2">Update</button>

                    </form>
                  </div>
                </div>
              </div>
</body>
{% endblock %}
</html>
