<!DOCTYPE html>
{% extends 'dashboard.html'%}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="col-lg-12 grid-margin stretch-card">
                <div class="card">
                  <div class="card-body">
                    <h4 class="card-title">Order Details</h4>

                    <div class="table-responsive">
                      <table class="table table-hover">
                        <thead>
                          <tr>
                            <th>User Name</th>
                            <th>Product Name</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Total Price</th>

                          </tr>
                        </thead>
                        <tbody>
                        {% for c in cart_detail %}
                       <tr>
                         <td>{{c.username}}</td>
                         <td>{{c.product_name}}</td>
                         <td>{{c.price}}</td>
                         <td>{{c.quantity}}</td>
                         <td>{{c.total_price}}</td>
                       </tr>
                        {% endfor %}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
</body>
{% endblock %}
</html>
