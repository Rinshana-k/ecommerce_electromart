<!DOCTYPE html>
{% extends 'dashboard.html' %}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="col-lg-12 grid-margin stretch-card">
    <div class="card">
        <div class="card-body">
            <h4 class="card-title">Category details</h4>

            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead>
                    <tr>
                        <th>Category name</th>
                        <th> Description</th>
                        <th> Category image</th>
                        <th> Options </th>
                    </tr>
                    </thead>
                    <tbody>
                    {% for i in category %}
                    <tr>
                      <td>{{i.Category_name}}</td>
                      <td>{{i.Description}}</td>
                      <td>
                          <img src="{{i.Category_img.url}}" height="500px" width="500px">
                      </td>
                        <td>
                            <a href="{% url 'edit_category' c_id=i.id %}">
                                <button class="btn btn-outline-success">Edit</button>
                            </a>
                            <a href="{% url 'delete_category' c_id=i.id %}">
                                <button class="btn btn-outline-danger">Delete</button>
                            </a>
                        </td>

                    </tr>
                    {% endfor%}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
{% endblock %}
</html>
